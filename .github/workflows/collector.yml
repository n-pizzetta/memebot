name: paper-bot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # toutes les 15 min, hors minutes pleines (moins de créneaux sautés). Dépôt public : gratuit. Dépôt privé : passe à "7 * * * *" (1x/heure)
  workflow_dispatch: {}       # bouton "Run workflow" pour lancer à la main
  push:                       # chaque modification du code lance aussi un cycle
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write             # pour sauvegarder data/journal.db dans le dépôt

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest

      # Si un gate ou un disjoncteur ne se déclenche plus, le bot ne tourne pas.
      - name: Tests
        run: python -m pytest -q

      - name: Run one cycle
        env:
          SOLANA_RPC: ${{ secrets.SOLANA_RPC }}   # optionnel : URL RPC Helius gratuite
        run: python -m bot.run

      - name: Report
        if: always()
        run: python -m bot.report >> "$GITHUB_STEP_SUMMARY"

      - name: Save journal
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data/journal.db
          git diff --cached --quiet || git commit -m "journal: $(date -u +%FT%TZ)"
          git pull --rebase --quiet && git push --quiet
